# Render Blueprint for the API (Dashboard → New → Blueprint → pick this repo).
# The client is deployed separately on Vercel (see vercel.json).
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-2) to keep query latency low.
    region: ohio
    # --include=dev: tsx (runtime) and the prisma CLI are devDependencies.
    # Migrations run on every deploy; `migrate deploy` only applies new ones and never resets data.
    buildCommand: >-
      npm ci --include=dev &&
      npm run prisma:generate -w server &&
      npm run prisma:deploy -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    # Don't redeploy the API when only the client or docs change.
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Vercel rewrite → Render proxy → Express. See server/src/config/env.schema.ts.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Random secrets generated by Render on first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Values you paste in the dashboard (sync: false = Render prompts for them).
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
